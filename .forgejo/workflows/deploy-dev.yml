name: Deploy Dev

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Test Server
    runs-on: docker
    container:
      image: node:22-alpine

    steps:
      - name: Install system deps
        run: apk add --no-cache git openssh-client rsync

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, never interpolated into the script: branch names
          # may contain shell metacharacters such as $( ) ; |
          REF: ${{ github.ref }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          # Keep the token out of .git/config while dependency code runs in later steps
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git checkout "$REF"

      - name: Install pnpm
        run: corepack enable && corepack install  # version from packageManager in package.json

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned host key (ED25519, SHA256:nOxgz1IQ0klpetz4Xo0k63rmWac23ZeSwdLm5FrK7NI).
          # ssh-keyscan on every run would trust whatever answers; if the server's
          # host key ever changes, verify the new one and update this line.
          KNOWN_HOST: cloud.linux-nerds.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPRPf55guMUOVOBQKrphYOe3jpeOm2AJ9g+UF09J2zdT
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts

      # The deploy user's key is bound to a forced command on the server
      # (deploy/server/agenda-deploy): uploads are confined to the app
      # directory, and "restart" is the only other thing it accepts.
      - name: Upload dist/
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ \
            deploy@cloud.linux-nerds.org:./

      - name: Restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy@cloud.linux-nerds.org restart

      # The proxy is a separate container. Its two files go over as a tar
      # stream; deploy/server/agenda-proxy-install syntax-checks them in the
      # proxy's image, swaps them in, restarts, and rolls back if the new
      # version does not answer.
      - name: Update ICS proxy
        run: |
          tar -c -C deploy/ics-proxy server.js package.json \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                deploy@cloud.linux-nerds.org proxy-install

      - name: Done
        run: echo "Deploy fertig. https://cloud.linux-nerds.org/apps/opencloud-agenda/"
