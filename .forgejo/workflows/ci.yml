name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build / Test
    runs-on: docker
    container:
      image: node:22-alpine

    steps:
      - name: Install system deps
        run: apk add --no-cache git

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          # Keep the token out of .git/config while dependency code runs in later steps
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git checkout ${{ github.sha }}

      - name: Install pnpm
        run: corepack enable && corepack install  # version from packageManager in package.json

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Zero-dependency Node script, so it has its own node:test suite rather
      # than running under vitest's browser-like environment.
      - name: Test ICS proxy
        run: pnpm test:proxy
