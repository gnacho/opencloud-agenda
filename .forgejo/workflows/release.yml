name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: docker
    container:
      image: node:20-alpine

    steps:
      - name: Install system deps
        run: apk add --no-cache git zip curl

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          git checkout ${{ github.sha }}

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package zip
        run: |
          mkdir -p _pkg/agenda
          cp -r dist/* _pkg/agenda/
          cd _pkg && zip -r ../agenda-${{ github.ref_name }}.zip agenda/

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          REPO=${{ github.repository }}
          API="${GITHUB_SERVER_URL}/api/v1"

          # Wait for Forgejo to auto-create the release from the tag (retry up to 30s)
          for i in $(seq 1 6); do
            RELEASE_ID=$(curl -sf "${API}/repos/${REPO}/releases/tags/${TAG}" \
              -H "Authorization: token ${GITHUB_TOKEN}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            [ -n "$RELEASE_ID" ] && break
            echo "Waiting for release to appear... ($i)"
            sleep 5
          done

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Release for tag ${TAG} not found after waiting."
            exit 1
          fi

          echo "Release ID: ${RELEASE_ID}"

          # Upload the zip as a release asset
          curl -sf -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=agenda-${TAG}.zip" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @"agenda-${TAG}.zip"
