name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: docker
    container:
      image: node:22-alpine

    steps:
      - name: Install system deps
        run: apk add --no-cache git zip curl

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${{ github.repository }}.git" .
          # Keep the token out of .git/config while dependency code runs in later steps
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git checkout ${{ github.sha }}

      - name: Install pnpm
        run: corepack enable && corepack install  # version from packageManager in package.json

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _pkg/opencloud-agenda
          cp -r dist/* _pkg/opencloud-agenda/
          cd _pkg && zip -r "../agenda-${TAG}.zip" opencloud-agenda/

      - name: Create release and upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Passed via env, never interpolated into the script: tag names may
          # contain shell metacharacters such as $( ) ; |
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # TAG also ends up in JSON and API URLs — accept only plain version tags.
          case "$TAG" in
            *[!A-Za-z0-9._+-]*) echo "Refusing unexpected tag name: $TAG" >&2; exit 1 ;;
          esac
          API="${GITHUB_SERVER_URL}/api/v1"

          # Delete any existing release for this tag (removes Ghost-authored or duplicate releases)
          EXISTING_ID=$(curl -sf "${API}/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2 || true)
          if [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release ${EXISTING_ID}"
            curl -sf -X DELETE "${API}/repos/${REPO}/releases/${EXISTING_ID}" \
              -H "Authorization: token ${GITHUB_TOKEN}"
          fi

          # Create a fresh release under the RELEASE_TOKEN user
          RELEASE=$(curl -sf -X POST "${API}/repos/${REPO}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"See [CHANGELOG](https://forgejo.linux-nerds.org/${REPO}/src/branch/main/CHANGELOG.md) for details.\"}")
          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          echo "Release ID: ${RELEASE_ID}"

          # Upload the zip as a release asset
          curl -sf -X POST "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=agenda-${TAG}.zip" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @"agenda-${TAG}.zip"
