name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p _pkg/opencloud-agenda
          cp -r dist/* _pkg/opencloud-agenda/
          cd _pkg && zip -r "../agenda-${version}.zip" opencloud-agenda/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "agenda-${version}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
