# Tool versions and these settings follow OpenCloud Web (opencloud-eu/web) and
# the official web extensions (opencloud-eu/web-extensions), not "latest".

# Only install releases that have been public for at least 12 h (minutes).
minimumReleaseAge: 720

allowBuilds:
  esbuild: true
  vue-demi: true

overrides:
  # same pins as OpenCloud Web; pulled in at build time by @opencloud-eu/extension-sdk
  axios: 1.20.0
  adm-zip: ^0.6.1
  ws: ^8.21.2
  # GHSA-68fv-2mgg-jv7q (event-loop DoS); reached only through the Vue
  # compiler at build time, but there is no reason to keep the hit in `pnpm audit`
  source-map-js: '>=1.2.2'
